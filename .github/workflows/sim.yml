name: sim

# The workflow simulation (docs/simulation-plan.md): scripted agents drive the real engine.
# Pull requests run the fast set against the committed baseline; nightly runs everything,
# plus the canaries that prove the simulation can still fail.

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  fast:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Git identity for the scratch repos the simulation creates
        run: |
          git config --global user.name "kahnban-ci"
          git config --global user.email "ci@example.invalid"
      - run: python -m pip install -e ".[dev]"
      - name: Fast scenarios against the committed baseline
        run: python tests/run_sim.py compare --out scorecard.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard-${{ matrix.os }}
          path: scorecard.json

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git config --global user.name "kahnban-ci"
          git config --global user.email "ci@example.invalid"
      - run: python -m pip install -e ".[dev]"
      - name: Every scenario against the committed baseline
        run: python tests/run_sim.py compare --set all --out scorecard.json
      - name: Canaries (each deliberate breakage must turn the simulation red)
        run: python tests/run_sim.py canaries
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard-nightly
          path: scorecard.json
